# Bibliography. Every figure in a moment (src/content/moments) lists the keys
# of the sources that support it; the build fails if a key is missing here.
#
# kind:
#   web        a web page we checked the figure against
#   book       a published work
#   official   an official history
#   data       map data
# via: when a figure was checked against a secondary page that quotes the
#   work (usually a Wikipedia article's citation), the page is named here, so
#   readers can see exactly how far the check went.

- id: ddaystory
  kind: web
  author: The D-Day Story, Portsmouth
  title: What is D-Day?
  url: https://theddaystory.com/discover/what-is-d-day/
  accessed: 2026-09-23
  note: Portsmouth's D-Day museum. Troops landed by beach and nation, ships, aircraft, D-Day deaths, build-up to D+5.

- id: crs2019
  kind: official
  author: Congressional Research Service
  title: "Defense Primer: 75th Anniversary of D-Day, June 6, 1944 (IF11228)"
  publisher: Library of Congress
  year: 2019
  url: https://www.congress.gov/crs-product/IF11228
  accessed: 2026-09-23
  note: D-Day casualties by nation; campaign losses including German prisoners and French civilian deaths.

- id: citino-reception
  kind: web
  author: Robert Citino
  title: "The Reception: The Germans on D-Day"
  publisher: The National WWII Museum
  url: https://www.nationalww2museum.org/war/articles/reception-germans-d-day
  accessed: 2026-09-23
  note: German strength in the West on the eve of D-Day.

- id: weinberg1994
