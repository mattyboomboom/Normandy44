# Airborne assault (00:16 – 02:30, 6 June)
order: 4
title: Airborne assault
sound: air
day: 0
date: 00:16 – 02:30, 6 June
cam: [[-1.56, 49.17], [-0.08, 49.5]]
state: s0
beaches: true
body:
- Gliders of the British 6th Airborne Division land beside the Caen canal and Orne bridges at 00:16 and take both intact, sealing the eastern flank.
- From 01:30 the US 101st, then the 82nd, jump behind Utah to hold the causeways and the Merderet crossings. Thick cloud and flak scatter many of them miles from their drop zones.
- Between them the two airborne forces are to seal the flanks of the invasion. The Americans screen the west, along the Merderet and the Douve; the British screen the east, blowing the Dives bridges so German reserves cannot reach the Orne. The dashed arrows show where the five beaches were meant to be by nightfall.
