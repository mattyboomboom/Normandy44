- title: Break-in
  sound: battle
  day: 20
  date: 26 June
  cam: [[-0.625, 49.085], [-0.425, 49.205]]
  state: s3
  body:
  - On 25 June the 49th (West Riding) Division attacks on the right flank at Fontenay-le-Pesnel (Operation Martlet), to clear the high ground at Rauray.
  - At 07:30 on the 26th the 15th (Scottish) Division goes in behind a rolling barrage, with Churchill tanks of the 31st Tank Brigade. By midday it holds Saint-Manvieu and Cheux, and counter-attacks by the 12th SS are driven off.
