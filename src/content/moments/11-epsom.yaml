- title: The Scottish Corridor
  sound: battle
  day: 21
  date: 27–28 June
  cam: [[-0.625, 49.085], [-0.425, 49.205]]
  state: s4
  body:
  - On the 27th the Argyll and Sutherland Highlanders seize the bridge over the Odon at Tourmauville, and the 11th Armoured Division pushes its tanks down a narrow corridor and across the river.
  - On the 28th British tanks reach the crest of Hill 112. Battle groups of the 1st SS and 2nd SS Panzer Divisions attack both sides of the corridor and come within a kilometre of cutting it.
