- title: II SS Panzer Corps strikes
  sound: battle-heavy
  day: 23
  date: 29 June – 1 July
  cam: [[-0.625, 49.085], [-0.425, 49.205]]
  state: s4
  body:
  - On the afternoon of the 29th the 9th and 10th SS Panzer Divisions, just arrived from the Eastern Front, attack the salient. A map taken from a captured officer gives the British warning.
  - Dempsey pulls his tanks back off Hill 112 and the line holds. The Germans have used up the only armoured reserve they had, which had been gathering to strike towards Bayeux and the Americans. Rundstedt tells Berlin to make peace, and is replaced.
