- title: Rain on the ridge
  day: 43
  date: 19–20 July
  cam: [[-0.42, 49.09], [-0.17, 49.25]]
  state: s6
  body:
  - The fighting goes on for two more days. The British edge closer to the ridge and the Canadians clear southern Caen, but on the 20th a thunderstorm turns the ground to mud and the Canadian attack on Verrières Ridge is thrown back.
  - Goodwood costs tanks, which Britain can replace, rather than infantry, which it cannot. Montgomery’s written orders were to “write down” the German armour, and in the week before Cobra the 1st and 12th SS stay at Caen. His messages to Eisenhower had sounded like a breakthrough, though, and Eisenhower felt misled.
