- title: The carpet
  day: 42
  date: 18 July, dawn
  cam: [[-0.42, 49.09], [-0.17, 49.25]]
  state: s7
  body:
  - At 05:45 more than a thousand RAF heavy bombers, followed by US heavy and medium bombers, 2,077 aircraft in all, bomb the villages either side of a corridor east of Caen.
  - At 07:45 the 11th Armoured Division leads out of the Orne bridgehead won by the airborne on D-Day, with the Guards and 7th Armoured queuing behind to cross the few bridges. On the right the Canadians attack Colombelles and the suburbs of Caen (Operation Atlantic).
