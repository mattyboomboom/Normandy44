- title: The ridge
  day: 42
  date: 18 July, midday
  cam: [[-0.42, 49.09], [-0.17, 49.25]]
  state: s7
  body:
  - By late morning the advance meets the German second line. At Cagny a battery of 88 mm guns and von Luck’s assault guns knock out tank after tank, and ahead the 1st SS Panzer Division holds Bourguébus Ridge.
  - The 11th Armoured Division, out in the open cornfields under the ridge, loses tanks by the score. The Guards are held at Cagny, and the 7th Armoured is still struggling forward through the traffic behind.
