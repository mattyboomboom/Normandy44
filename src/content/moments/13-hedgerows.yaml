# The hedgerow war (7–19 July)
order: 13
title: The hedgerow war
sound: bocage
day: 38
date: 7–19 July
cam: [[-1.63, 49.06], [-0.93, 49.33]]
state: s7
beaches: false
body:
- South of the beaches the land breaks into thousands of small fields, each walled by an earth bank a metre or two high and crowned with hedge. Every field is a fortress and every sunken lane an ambush. First Army’s July offensive towards Saint-Lô costs about 40,000 casualties for twenty miles.
- The answer comes from the ranks. Sergeant Curtis G. Culin of the 102nd Cavalry Reconnaissance Squadron welds steel teeth, cut from German beach obstacles, to the front of a Sherman, so it can burst through a hedgerow instead of rearing up over it and exposing its thin underside. Bradley watches a demonstration on 14 July, and some 500 are made in time for Cobra.
- Saint-Lô, a heap of ruins, falls on 18–19 July. Major Thomas Howie of the 116th Infantry, killed on the 17th, is carried into the town on the bonnet of a jeep.
