body:
- Cherbourg’s commander, von Schlieben, surrenders on 26 June and the last forts fall within days. But the Germans have wrecked the port so thoroughly that it will be weeks before it can handle cargo.
- In three weeks VII Corps has cleared the whole Cotentin peninsula, taking some 39,000 prisoners.
