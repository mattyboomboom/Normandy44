- title: Through the gap
  sound: battle
  day: 50
  date: 26–27 July
  cam: [[-1.56, 48.93], [-1.0, 49.25]]
  state: s6
  body:
  - On the 26th Collins commits his armour. The 1st Infantry Division and the 3rd Armored drive for Marigny and on towards Coutances; the 2nd Armored swings south through Saint-Gilles and Canisy and reaches Le Mesnil-Herman on the 27th.
  - There is almost nothing behind the German line to stop them. The panzer divisions are at the other end of the front, facing the British and Canadians.
