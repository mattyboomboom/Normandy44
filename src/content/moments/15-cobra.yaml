steps:
- title: The breakthrough
  sound: bombing
  day: 49
  date: 24–25 July
  cam: [[-1.56, 48.93], [-1.0, 49.25]]
  state: s6
  body:
  - After a false start on the 24th, when bombs fall short, the attack goes in on the 25th. At 09:38 fighter-bombers strike first, then the Eighth Air Force’s heavy bombers saturate a box 6,000 yards by 2,200 south of the Périers–Saint-Lô road. Short bombing kills 111 Americans, among them Lt Gen Lesley McNair.
  - Panzer Lehr, sitting in the box, is shattered, and the 9th and 30th Infantry Divisions push into the gap, slowly at first. At the other end of the front the Canadians attack Verrières Ridge the same morning (Operation Spring), to hold the SS panzer divisions at Caen.
