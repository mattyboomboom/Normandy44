- title: The collapse
  sound: fighters
  day: 52
  date: 28–29 July
  cam: [[-1.56, 48.93], [-1.0, 49.25]]
  state: s8
  body:
  - In the west VIII Corps rolls down the coast road, and the 4th Armored Division takes Coutances on the 28th. German units falling back from the coast are cut off around Roncey.
  - On the 29th fighter-bombers catch a jammed German column near Roncey and destroy it. The road to Avranches and Brittany is open.
