body:
- In April and May 1944, at St Paul’s School in London, Montgomery lays out the plan. The campaign will pivot on Caen. The British and Canadians will form a shoulder in the east, drawing in and fighting the German armour.
- Behind that shield the Americans will take Cherbourg and the Cotentin, break out into Brittany for its ports, then wheel east. The planners allow ninety days to reach the Seine.
