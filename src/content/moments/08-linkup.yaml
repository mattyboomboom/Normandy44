beaches: true
body:
- The 101st Airborne takes Carentan on 12 June, joining Utah and Omaha into one continuous front.
- Next day a British armoured hook around Tilly (Operation Perch) is stopped dead at Villers-Bocage by Tiger tanks. German armour, including 12th SS and Panzer Lehr, is now massed in front of Caen.
