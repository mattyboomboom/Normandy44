body:
- Canadians take Carpiquet on 4 July. On the evening of the 7th, some 450 heavy bombers flatten much of the old city, and Operation Charnwood clears Caen north of the Orne by 9 July.
- 'On the 10th the 43rd (Wessex) Division attacks Hill 112 again (Operation Jupiter). The hill ends up in no man’s land, but II SS Panzer Corps is ground down: the 10th SS Panzer Division falls from about 15,000 men to under 2,300.'
