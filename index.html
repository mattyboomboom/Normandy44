<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Normandy 1944 — 85 days from the beaches to the Seine</title>
<meta name="description" content="An animated, interactive map of the Battle of Normandy, 6 June to 30 August 1944.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#23343f; --sea-deep:#182530; --grat:rgba(233,228,212,.07);
  --land-fr:#d6cba9; --land-other:#b4b7a2; --coast:#6f6a52;
  --us:#2e62ab; --uk:#b98a2c; --ca:#b3372f; --pl:#8f2a52; --fr:#5a4fb0; --de:#26241f; --all:#e9e4d4;
  --ink:#ece7d8; --ink-dim:#aeb4ab; --panel:rgba(22,32,39,.94); --rule:rgba(236,231,216,.14);
  --stencil:"Big Shoulders Stencil Display","Arial Narrow",Impact,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;
  --panel-w:min(420px,36vw); --bar-h:84px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea-deep);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.sea{fill:var(--sea)}
.grat{fill:none;stroke:var(--grat);stroke-width:.7}
.world{fill:var(--land-other)}
.borders{fill:none;stroke:rgba(60,60,48,.35);stroke-width:.6;stroke-dasharray:2 2}
.land-fr{fill:var(--land-fr);stroke:var(--coast);stroke-width:.6}
.land-other{fill:var(--land-other);stroke:var(--coast);stroke-width:.5}
.river{fill:none;stroke:#6f93a6;stroke-width:1.1;stroke-linecap:round;opacity:.8}
.river.minor{stroke-width:.8;opacity:.6}

.front{fill:none}
.beach{fill:none;stroke-width:7;stroke-linecap:round}
.beach-label{font-family:var(--stencil);font-weight:800;font-size:22px;letter-spacing:.04em;paint-order:stroke;stroke:var(--sea);stroke-width:4px}
.place{font-family:var(--serif);font-size:12.5px;fill:#2c2a22;paint-order:stroke;stroke:rgba(214,203,169,.85);stroke-width:3px;stroke-linejoin:round}
.place.big{font-weight:600;font-size:14px}
.place-dot{fill:#2c2a22}
.sea-label{font-family:var(--serif);font-style:italic;font-size:15px;fill:rgba(236,231,216,.45);letter-spacing:.12em}
.arrow{fill:none;stroke-linecap:round;stroke-linejoin:round}
.arrow-casing{fill:none;stroke:rgba(20,20,16,.45);stroke-linecap:round}
.ev-label{font-family:var(--serif);font-size:13.5px;font-weight:600;fill:#16150f;paint-order:stroke;stroke:rgba(236,231,216,.92);stroke-width:3.5px;stroke-linejoin:round}
.ev-note{font-family:var(--serif);font-style:italic;font-size:12px;fill:#2b2a22;paint-order:stroke;stroke:rgba(236,231,216,.88);stroke-width:3px;stroke-linejoin:round}
.pulse{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}

/* Day counter: the one loud element */
#counter::before{content:"";position:absolute;inset:-60px -90px -40px -60px;background:radial-gradient(ellipse at 30% 40%,rgba(16,24,30,.55),rgba(16,24,30,0) 70%);z-index:-1}
#counter{position:fixed;left:clamp(16px,3vw,40px);top:calc(env(safe-area-inset-top,0px) + clamp(10px,2.4vh,28px));pointer-events:none;z-index:3}
#dnum{font-family:var(--stencil);font-weight:800;font-size:clamp(64px,11vw,150px);line-height:.82;letter-spacing:-.01em;color:var(--ink);text-shadow:0 0 2px rgba(16,24,30,.9),0 2px 24px rgba(16,24,30,.55);font-variant-numeric:tabular-nums}
#ashore{font-size:14px;color:var(--ink-dim);margin-top:.35em;text-shadow:0 1px 8px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#ashore b{font-family:var(--stencil);font-weight:800;font-size:20px;color:var(--ink);letter-spacing:.01em}
#ddate{font-family:var(--serif);font-size:clamp(15px,1.4vw,19px);margin-top:.5em;color:var(--ink);text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* Intro title on the globe */
#intro{position:fixed;left:clamp(16px,3vw,40px);bottom:calc(var(--bar-h) + 28px);max-width:32rem;z-index:3;transition:opacity .8s;background:rgba(22,32,39,.86);padding:22px 26px 24px;border-radius:2px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#intro h1{font-family:var(--stencil);font-weight:800;font-size:clamp(38px,5.2vw,72px);line-height:.9;margin:0 0 .3em;letter-spacing:.005em}
#intro p{font-size:17px;line-height:1.5;margin:0 0 1.1em;color:var(--ink-dim);max-width:26rem}
#intro .go{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--serif);font-size:15px;font-weight:600;border-radius:3px;padding:.62em 1.1em;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--sea-deep)}
.btn:hover{filter:brightness(1.08)}
.hidden{opacity:0;pointer-events:none}

/* Info panel */
#panel{position:fixed;right:clamp(12px,1.6vw,24px);top:clamp(12px,2vh,24px);bottom:calc(var(--bar-h) + 14px);width:var(--panel-w);background:var(--panel);border-left:4px solid var(--accent,var(--ink));border-radius:2px;z-index:4;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:border-color .6s}
#panel-scroll{overflow-y:auto;padding:22px 24px 20px;scrollbar-width:thin}
#p-date{font-size:14.5px;color:var(--ink-dim);margin:0}
#p-title{font-family:var(--stencil);font-weight:800;font-size:clamp(30px,2.8vw,42px);line-height:.95;margin:.2em 0 .45em}
#p-body p{font-size:16px;line-height:1.58;margin:0 0 .85em;max-width:34em}
#forces{margin-top:1.1em;border-top:1px solid var(--rule);padding-top:.9em}
#forces h3{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink-dim);margin:0 0 .6em}
.frow{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;padding:.5em 0;border-bottom:1px solid var(--rule)}
.frow:last-child{border-bottom:0}
.fsw{grid-row:span 2;border-radius:1px}
.fk{font-size:14.5px;line-height:1.3}
.fv{font-family:var(--stencil);font-weight:800;font-size:22px;line-height:1;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fs{grid-column:2 / 4;font-size:13px;color:var(--ink-dim);line-height:1.35;margin-top:.15em}
#p-toggle{display:none}
.panel-enter{animation:panelIn .5s ease both}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Legend */
#legend{transition:opacity .6s;position:fixed;left:clamp(12px,1.6vw,24px);bottom:calc(var(--bar-h) + 12px);z-index:3;background:rgba(22,32,39,.82);padding:10px 12px;border-radius:2px;font-size:13px;line-height:1.2;display:grid;grid-template-columns:auto auto;gap:6px 14px}
#legend .li{display:flex;align-items:center;gap:7px;white-space:nowrap}
#legend .sw{width:16px;height:11px;border-radius:1px;opacity:.85}
#legend .ln{width:18px;height:3px;background:#1e1b17;box-shadow:0 0 0 1.5px rgba(236,231,216,.6)}
#legend svg{display:block}

/* Timeline bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));padding:0 clamp(12px,1.6vw,24px) env(safe-area-inset-bottom,0px);background:linear-gradient(to top,rgba(16,24,30,.97),rgba(16,24,30,.88));border-top:1px solid var(--rule);z-index:5;display:flex;align-items:center;gap:clamp(10px,1.4vw,20px)}
.ctl{width:42px;height:42px;border-radius:50%;border:1px solid rgba(236,231,216,.35);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ctl.play{width:50px;height:50px;background:var(--ink);color:var(--sea-deep);border:0}
.ctl:hover{border-color:var(--ink)}
.ctl svg{width:18px;height:18px}
.ctl:disabled{opacity:.3;cursor:default}
#track{position:relative;flex:1;height:100%;min-width:0}
#rail{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(236,231,216,.18);transform:translateY(-50%)}
#fill{position:absolute;left:0;top:50%;height:2px;background:var(--ink);transform:translateY(-50%);width:0}
.tick{position:absolute;top:50%;width:26px;height:40px;margin-left:-13px;transform:translateY(-50%);background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.tick i{display:block;width:9px;height:9px;border-radius:50%;background:var(--sea-deep);border:2px solid rgba(236,231,216,.55);transition:transform .2s,background .2s}
.tick.done i{background:var(--ink);border-color:var(--ink)}
.tick.on i{transform:scale(1.55);background:var(--ink);border-color:var(--ink)}
.tick:hover i{border-color:var(--ink)}
.tick .tl{position:absolute;top:calc(50% + 14px);left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--ink-dim);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.tick.on .tl,.tick:hover .tl{opacity:1;color:var(--ink)}
.month{position:absolute;top:8px;font-size:12px;color:var(--ink-dim);font-style:italic;transform:translateX(-2px);pointer-events:none}
#count{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
:focus-visible{outline:2px solid #f0d27a;outline-offset:3px}
#pop{position:fixed;z-index:6;max-width:260px;background:var(--panel);border-radius:2px;padding:9px 12px;font-size:14px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.4);pointer-events:none;border-left:3px solid var(--pc,var(--ink))}
#pop b{display:block;font-weight:600}
#pop span{color:var(--ink-dim);font-style:italic}
.ev{cursor:pointer}
#note{position:fixed;right:clamp(12px,1.6vw,24px);bottom:calc(var(--bar-h) + 14px);transform:translateY(100%);font-size:11px;color:rgba(236,231,216,.5);z-index:3;display:none}

@media (max-width:900px){
  :root{--bar-h:70px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--bar-h) + 8px);max-height:40vh;border-left:0;border-top:4px solid var(--accent,var(--ink))}
  #panel.open{max-height:72vh}
  #panel-scroll{padding:14px 16px 10px}
  #p-title{font-size:28px}
  #p-body p{font-size:15px}
  #p-toggle{display:block;position:absolute;right:10px;top:10px;background:rgba(236,231,216,.1);border:0;color:var(--ink);font-family:var(--serif);font-size:13px;padding:.35em .7em;border-radius:2px;cursor:pointer}
  #legend{display:none}
  body.at-intro #panel{display:none}
  body.at-intro #intro{bottom:calc(var(--bar-h) + 20px)}
  #intro{bottom:calc(var(--bar-h) + 42vh)}
  #intro p{font-size:15px}
  .ctl{width:38px;height:38px}.ctl.play{width:44px;height:44px}
  .tick{width:18px;margin-left:-9px}
  .tick i{width:7px;height:7px}
  .tick .tl,.month{display:none}
  #count{display:none}
}
@media (prefers-reduced-motion:reduce){
  .pulse{animation:none;opacity:0}
  .panel-enter{animation:none}
}
</style>
</head>
<body>
<svg id="map" role="img" aria-label="Animated map of the Normandy campaign">
  <defs>
    <filter id="frontline" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.8" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="out" result="o"/>
      <feFlood flood-color="#1c1a15" result="c"/>
      <feComposite in="c" in2="o" operator="in"/>
    </filter>
    <clipPath id="clip-fr"><use href="#land-fr"/></clipPath>
    <clipPath id="clip-world" clip-rule="evenodd"><path id="world-hole" clip-rule="evenodd"/></clipPath>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a2a1f" stroke-width="2"/>
    </pattern>
    <g id="markers"></g>
  </defs>
  <path class="sea" id="sphere"/>
  <path class="grat" id="grat"/>
  <g clip-path="url(#clip-world)"><path class="world" id="world"/></g>
  <path class="borders" id="borders"/>
  <path class="land-other" id="land-other"/>
  <path class="land-fr" id="land-fr"/>
  <g id="rivers"></g>
  <g clip-path="url(#clip-fr)">
    <g id="rings" opacity=".62"></g>
    <g id="front" filter="url(#frontline)"></g>
  </g>
  <g id="bombs"></g>
  <g id="beaches"></g>
  <g id="places"></g>
  <g id="arrows"></g>
  <g id="events"></g>
  <g id="sealabels"></g>
</svg>

<div id="counter" aria-live="polite"><div id="dnum">D−1</div><div id="ddate">5 June 1944</div><div id="ashore"></div></div>

<div id="intro">
  <h1>Normandy, 1944</h1>
  <p>Eighty-five days from the beaches to the Seine: how the Allies landed, held on, broke out and trapped two German armies.</p>
  <div class="go">
    <button class="btn primary" id="btn-begin">Play the campaign</button>
    <button class="btn" id="btn-step">Step through</button>
  </div>
</div>

<aside id="panel" aria-live="polite">
  <button id="p-toggle" aria-expanded="false">More</button>
  <div id="panel-scroll">
    <p id="p-date"></p>
    <h2 id="p-title"></h2>
    <div id="p-body"></div>
    <section id="forces"><h3 id="f-head">Troops and formations (approximate)</h3><div id="f-rows"></div></section>
  </div>
</aside>

<div id="legend" aria-label="Map key">
  <div class="li"><span class="sw" style="background:var(--us)"></span>US control</div>
  <div class="li"><span class="ln"></span>Front line</div>
  <div class="li"><span class="sw" style="background:var(--uk)"></span>British control</div>
  <div class="li"><svg width="18" height="12"><path d="M1 6H12" stroke="#ece7d8" stroke-width="5" stroke-linecap="round" opacity=".55"/><path d="M1 6H12" stroke="#26241f" stroke-width="2.5" stroke-linecap="round"/><path d="M10.5 1.5L17 6L10.5 10.5Z" fill="#26241f" stroke="#ece7d8" stroke-width=".8" stroke-opacity=".6"/></svg>German move</div>
  <div class="li"><span class="sw" style="background:var(--ca)"></span>Canadian control</div>
  <div class="li"><svg width="14" height="14"><rect x="2" y="2" width="10" height="10" fill="#26241f" stroke="#ece7d8" stroke-width="1.5"/></svg>German fortress</div>
</div>

<div id="pop" role="tooltip" hidden><b id="pop-t"></b><span id="pop-n"></span></div>
<nav id="bar" aria-label="Campaign timeline">
  <button class="ctl" id="prev" aria-label="Previous moment"><svg viewBox="0 0 20 20"><path d="M13 3L6 10L13 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="ctl play" id="play" aria-label="Play"><svg viewBox="0 0 20 20" id="play-ico"><path d="M6 3.5L16 10L6 16.5Z" fill="currentColor"/></svg></button>
  <button class="ctl" id="next" aria-label="Next moment"><svg viewBox="0 0 20 20"><path d="M7 3L14 10L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="track"><div id="rail"></div><div id="fill"></div></div>
  <div id="count"></div>
</nav>

      const g = gBeaches.select(`[data-k="${k}"]`);
      const ln = GEO.beaches[k];
      g.select('path').attr('d', 'M' + ln.map(p => proj(p).map(v => v.toFixed(1)).join(',')).join('L'))
        .attr('stroke-width', Math.max(3, Math.min(9, s / 7000)));
      const mid = proj(ln[Math.floor(ln.length / 2)]);
      const lbl = g.select('text').style('display', s > 20000 ? null : 'none');
      const tight = s < 45000;
      if (k === 'utah') lbl.attr('x', mid[0] + (tight ? -14 : 14)).attr('y', mid[1] + 6).attr('text-anchor', tight ? 'end' : 'start');
      else if (tight && k === 'juno') lbl.attr('x', mid[0]).attr('y', mid[1] + 30).attr('text-anchor', 'middle');
      else lbl.attr('x', mid[0]).attr('y', mid[1] - 14).attr('text-anchor', 'middle');
    }
  }

  const evPts = arrived ? (scene.events || []).map(e => proj(e.p)).filter(Boolean) : [];
  placeSel.each(function (d) {
    const p = proj(d.p);
    if (p && evPts.some(q => Math.abs(q[0] - p[0]) < 70 && Math.abs(q[1] - p[1]) < 14)) { this.style.display = 'none'; return; }
    const show = s >= d.z && visible(d.p) && inView(p) && !hiddenPlaces.has(d.n) && !isBlocked(p);
    this.style.display = show ? null : 'none';
    if (show) this.setAttribute('transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
  });
  seaSel.each(function (d) {
    const p = proj(d.p);
    const show = s >= d.z && s < d.zmax && visible(d.p) && !isBlocked(p);
    this.style.display = show ? null : 'none';
    if (show) { this.setAttribute('x', p[0]); this.setAttribute('y', p[1]); }
  });

  renderOverlays();
}

// ------------------------------------------------------------------ scene overlays (events, arrows)
const gEvents = d3.select('#events'), gArrows = d3.select('#arrows'), gBombs = d3.select('#bombs');
const curve = d3.line().curve(d3.curveCatmullRom.alpha(0.5));

function symbol(g, e) {
  const c = NAT[e.nat || 'all'], light = '#f3efe2';
  switch (e.k) {
    case 'star':
      g.append('circle').attr('class', 'pulse').attr('r', 7).attr('stroke', c);
      g.append('circle').attr('r', 6.5).attr('fill', c).attr('stroke', light).attr('stroke-width', 2);
      break;
    case 'clash': {
      const pts = d3.range(16).map(i => { const r = i % 2 ? 4.2 : 10, a = i * Math.PI / 8; return [r * Math.cos(a), r * Math.sin(a)]; });
      g.append('circle').attr('class', 'pulse').attr('r', 8).attr('stroke', c);
      g.append('path').attr('d', 'M' + pts.join('L') + 'Z').attr('fill', c).attr('stroke', light).attr('stroke-width', 1.5);
      break;
    }
    case 'target':
      g.append('circle').attr('r', 9).attr('fill', 'none').attr('stroke', light).attr('stroke-width', 5);
      g.append('circle').attr('r', 9).attr('fill', 'none').attr('stroke', c).attr('stroke-width', 2.5);
      g.append('circle').attr('r', 2.5).attr('fill', c);
      break;
    case 'para':
      g.append('path').attr('d', 'M-9,0A9,8 0 0 1 9,0Z').attr('fill', c).attr('stroke', light).attr('stroke-width', 1.5);
      g.append('path').attr('d', 'M-8,0L0,10L8,0M0,0L0,10').attr('fill', 'none').attr('stroke', c).attr('stroke-width', 1.4);
      break;
    case 'fort':
      g.append('rect').attr('x', -6).attr('y', -6).attr('width', 12).attr('height', 12).attr('fill', NAT.de).attr('stroke', light).attr('stroke-width', 1.8);
      break;
    case 'gap':
      g.append('circle').attr('r', 26).attr('fill', 'rgba(38,36,31,.08)').attr('stroke', NAT.de).attr('stroke-width', 2).attr('stroke-dasharray', '5 4');
      break;
    case 'storm': {
      const wave = 'M-9,-2q3-5 6 0t6 0t6 0M-9,4q3-5 6 0t6 0t6 0';
      g.append('path').attr('d', wave).attr('fill', 'none').attr('stroke', light).attr('stroke-width', 4.5);
      g.append('path').attr('d', wave).attr('fill', 'none').attr('stroke', c).attr('stroke-width', 2);
      break;
    }
    case 'bomb':
      break;
    default:
      g.append('rect').attr('x', -5).attr('y', -5).attr('width', 10).attr('height', 10).attr('transform', 'rotate(45)').attr('fill', c).attr('stroke', light).attr('stroke-width', 1.6);
  }
}

function buildOverlays(sc) {
  gEvents.selectAll('*').remove(); gArrows.selectAll('*').remove(); gBombs.selectAll('*').remove();
  const evs = sc.events || [];
  hiddenPlaces = new Set(evs.map(e => e.n));
  evs.forEach((e, i) => {
    if (e.k === 'bomb') {
      const [x, y] = e.p, dx = 0.041, dy = 0.009;
      gBombs.append('path').datum({ type: 'Polygon', coordinates: [[[x - dx, y - dy], [x - dx, y + dy], [x + dx, y + dy], [x + dx, y - dy], [x - dx, y - dy]]] })
        .attr('fill', 'url(#hatch)').attr('stroke', '#8a2a1f').attr('stroke-width', 1.5).attr('opacity', 0)
        .transition().delay(200).duration(700).attr('opacity', 0.9);
    }
    const g = gEvents.append('g').attr('class', 'ev').attr('tabindex', 0).attr('role', 'button')
      .attr('aria-label', e.n + (e.note ? ': ' + e.note : '')).datum(e).attr('opacity', 0);
    symbol(g.append('g'), e);
    const lab = g.append('g').attr('class', 'lab');
    lab.append('text').attr('class', 'ev-label').text(e.n);
    if (e.note && !mobile) lab.append('text').attr('class', 'ev-note').attr('dy', 15).text(e.note);
    g.transition().delay(reduceMotion ? 0 : 250 + i * 180).duration(reduceMotion ? 0 : 500).attr('opacity', 1);
    g.on('mouseenter focus', ev => showPop(ev, e)).on('mouseleave blur', hidePop)
      .on('click', ev => { ev.stopPropagation(); showPop(ev, e); });
  });
  (sc.arrows || []).forEach(a => {
    const g = gArrows.append('g').datum(a);
    const casing = a.n === 'de' ? 'rgba(236,231,216,.75)' : 'rgba(22,22,18,.35)';
    g.append('path').attr('class', 'arrow-casing').attr('stroke', casing).attr('stroke-width', (a.w || 2.4) + 3);
    g.append('path').attr('class', 'arrow').attr('stroke', NAT[a.n]).attr('stroke-width', a.w || 2.4);
  });
  renderOverlays();
  gArrows.selectAll('g').each(function (a, i) {
    const g = d3.select(this), paths = g.selectAll('path');
    const len = g.select('.arrow').node().getTotalLength() || 1;
    const dash = a.dash ? '7 6' : null;
    if (reduceMotion) { paths.attr('stroke-dasharray', dash); g.select('.arrow').attr('marker-end', `url(#ah-${a.n})`); return; }
    paths.attr('stroke-dasharray', `${len} ${len}`).attr('stroke-dashoffset', len)
      .transition().delay(300 + i * 220).duration(1100).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0)
      .on('end', function () { d3.select(this).attr('stroke-dasharray', dash); });
    g.select('.arrow').transition('head').delay(300 + i * 220 + 1000).duration(0).attr('marker-end', `url(#ah-${a.n})`);
  });
}

function renderOverlays() {
  gEvents.selectAll('.ev').each(function (e) {
    const p = proj(e.p);
    const show = visible(e.p) && inView(p, 0);
    this.style.display = show ? null : 'none';
    if (!show) return;
    this.setAttribute('transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
    const lab = this.querySelector('.lab');
    const r = e.k === 'gap' ? 30 : 12;
    let lp = e.lp || (e.l ? 'l' : 'r');
    if (lp === 'r' && p[0] > avail.x + avail.w - 190) lp = 'l';
    const hasNote = !!lab.querySelector('.ev-note');
    const tf = { r: [r, -2, 'start'], l: [-r, -2, 'end'], t: [0, hasNote ? -30 : -16, 'middle'], b: [0, 24, 'middle'] }[lp] || [r, -2, 'start'];
    lab.setAttribute('transform', `translate(${tf[0]},${tf[1]})`);
    lab.querySelectorAll('text').forEach(t => t.setAttribute('text-anchor', tf[2]));
  });
  gBombs.selectAll('path').attr('d', d => gpath(d));
  gArrows.selectAll('g').each(function (a) {
    const d = curve(a.pts.map(p => proj(p)));
    this.querySelectorAll('path').forEach(p => p.setAttribute('d', d));
  });
}

function showPop(ev, e) {
  const pop = $('pop');
  $('pop-t').textContent = e.n;
  $('pop-n').textContent = e.note || '';
  pop.style.setProperty('--pc', NAT[e.nat || 'all']);
  pop.hidden = false;
  const r = ev.currentTarget.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.min(W - pw - 8, Math.max(8, r.left + r.width / 2 - pw / 2)) + 'px';
  pop.style.top = Math.max(8, r.top - ph - 10) + 'px';
}
function hidePop() { $('pop').hidden = true; }
document.addEventListener('click', hidePop);

// ------------------------------------------------------------------ panel, counter, timeline
function dayLabel(d) { return d < 0 ? 'D−' + (-d) : d === 0 ? 'D-Day' : 'D+' + d; }
let shownDay = null;
function setCounter(day) {
  const preDawn = scene && scene.day === 0 && scene.id !== 'nightfall';
  const d = Math.round(day);
  if (d !== shownDay) { $('dnum').textContent = dayLabel(d); shownDay = d; }
  const a = preDawn ? 0 : ashoreOn(day);
  $('ashore').innerHTML = a > 0 ? `<b>${(Math.round(a / 1000) * 1000).toLocaleString('en-GB')}</b> Allied troops ashore` : '';
}
function fullDate(sc) { return sc.date + (sc.date.includes('1944') ? '' : ' 1944'); }

function fillPanel(sc) {
  const panel = $('panel');
  const first = sc.forces && sc.forces.find(f => f.n !== 'all' && f.n !== 'de');
  panel.style.setProperty('--accent', first ? NAT[first.n] : NAT.all);
  $('p-date').textContent = fullDate(sc);
  $('p-title').textContent = sc.title;
  $('p-body').innerHTML = sc.body.map(p => `<p>${p}</p>`).join('');
  $('f-head').textContent = sc.forcesNote || 'Troops and formations (approximate)';
  $('f-rows').innerHTML = (sc.forces || []).map(f => `
    <div class="frow"><span class="fsw" style="background:${NAT[f.n]}" title="${NAT_NAME[f.n]}"></span>
      <span class="fk">${f.k}</span><span class="fv">${f.v || ''}</span>
      ${f.s ? `<span class="fs">${f.s}</span>` : ''}</div>`).join('');
  const ps = $('panel-scroll');
  ps.scrollTop = 0;
  ps.classList.remove('panel-enter'); void ps.offsetWidth; ps.classList.add('panel-enter');
  $('ddate').textContent = fullDate(sc);
}

const track = $('track');
const ticks = SCENES.map((sc, i) => {
  const b = document.createElement('button');
  b.className = 'tick';
  b.style.left = (i / (SCENES.length - 1) * 100) + '%';
  b.setAttribute('aria-label', `${sc.date}: ${sc.title}`);
  b.title = `${sc.date}: ${sc.title}`;
  b.innerHTML = `<i></i><span class="tl">${dayLabel(sc.day)}</span>`;
  b.addEventListener('click', () => { stopPlayTimer(); goTo(i); });
  track.appendChild(b);
  return b;
});
[['June', 0], ['July', SCENES.findIndex(s => s.day >= 25)], ['August', SCENES.findIndex(s => s.day >= 56)]].forEach(([mo, i]) => {
  const el = document.createElement('span');
  el.className = 'month'; el.textContent = mo;
  el.style.left = (i / (SCENES.length - 1) * 100) + '%';
  track.appendChild(el);
});
function setTimeline(i, frac = 0) {
  ticks.forEach((t, j) => { t.classList.toggle('on', j === i); t.classList.toggle('done', j < i); });
  $('fill').style.width = Math.min(100, (i + frac) / (SCENES.length - 1) * 100) + '%';
  $('count').textContent = `${i + 1} of ${SCENES.length}`;
  $('prev').disabled = i <= 0; $('next').disabled = i >= SCENES.length - 1;
}

// ------------------------------------------------------------------ transitions
let anim = null;
function goTo(i, opts = {}) {
  i = Math.max(0, Math.min(SCENES.length - 1, i));
  if (anim) { anim.stop(); anim = null; }
  hidePop();
  const prevScene = opts.fresh ? null : scene;
  idx = i; scene = SCENES[i]; arrived = false;
  try { history.replaceState(null, '', '#scene=' + (i + 1)); } catch (e) {}
  gEvents.selectAll('*').remove(); gArrows.selectAll('*').remove(); gBombs.selectAll('*').remove();
  hiddenPlaces = new Set();
  fillPanel(scene); setTimeline(i);
  $('intro').classList.toggle('hidden', i !== 0);
  $('legend').classList.toggle('hidden', i === 0);
  document.body.classList.toggle('at-intro', i === 0);
  layout(); measureBlocked();

  const from = Object.assign({}, cam), to = camFor(scene);
  const p0 = [from.lon * RAD * COS, from.lat * RAD, avail.w / from.scale];
  const p1 = [to.lon * RAD * COS, to.lat * RAD, avail.w / to.scale];
  const iz = d3.interpolateZoom(p0, p1);
  let dur = opts.duration != null ? opts.duration : Math.max(1300, Math.min(3400, iz.duration * 0.75));
  if (reduceMotion) dur = 0;

  const ringFrom = JSON.parse(JSON.stringify(rings)), ringTo = RS[scene.state];
  const dayFrom = prevScene ? prevScene.day : scene.day, dayTo = scene.day;

  const step = t => {
    const e = d3.easeCubicInOut(t);
    const z = iz(e);
    cam = { lon: z[0] / (RAD * COS), lat: z[1] / RAD, scale: avail.w / z[2] };
    const m = d3.easeCubicInOut(Math.max(0, Math.min(1, (t - 0.3) / 0.7)));
    for (const k of RING_KEYS) {
      const a = ringFrom[k], b = ringTo[k], r = rings[k];
      for (let n = 0; n < NPTS; n++) { r[n][0] = a[n][0] + (b[n][0] - a[n][0]) * m; r[n][1] = a[n][1] + (b[n][1] - a[n][1]) * m; }
    }
    setCounter(dayFrom + (dayTo - dayFrom) * e);
    render();
  };
  // the front-line filter is the most expensive layer, so it sits out camera moves
  d3.select('#front').style('display', 'none');
  if (dur === 0) { step(1); arrive(); return; }
  anim = d3.timer(el => {
    const t = Math.min(1, el / dur);
    step(t);
    if (t >= 1) { anim.stop(); anim = null; arrive(); }
  });
}
function arrive() {
  arrived = true;
  measureBlocked();
  d3.select('#front').style('display', null);
  buildOverlays(scene);
  render();
  if (playing) schedulePlay();
}

// ------------------------------------------------------------------ play
let playing = false, playTimer = null, playStart = 0, playDur = 0, progRaf = null;
function dwellFor(sc) {
  const words = sc.body.join(' ').split(/\s+/).length;
  return Math.max(7000, Math.min(16000, 5000 + words * 75));
}
function schedulePlay() {
  stopPlayTimer();
  if (idx >= SCENES.length - 1) { setPlaying(false); return; }
  playDur = dwellFor(scene); playStart = performance.now();
  playTimer = setTimeout(() => goTo(idx + 1), playDur);
  const tick = () => {
    if (!playing) return;
    const f = Math.min(1, (performance.now() - playStart) / playDur);
    setTimeline(idx, f);
    if (f < 1) progRaf = requestAnimationFrame(tick);
  };
  progRaf = requestAnimationFrame(tick);
}
function stopPlayTimer() {
  clearTimeout(playTimer); playTimer = null;
  if (progRaf) cancelAnimationFrame(progRaf); progRaf = null;
  if (idx >= 0) setTimeline(idx);
}
function setPlaying(on) {
  playing = on;
  $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
  $('play-ico').innerHTML = on ? '<path d="M5 3.5h3.5v13H5zM11.5 3.5H15v13h-3.5z" fill="currentColor"/>' : '<path d="M6 3.5L16 10L6 16.5Z" fill="currentColor"/>';
  if (!on) { stopPlayTimer(); return; }
  if (idx >= SCENES.length - 1) goTo(0);
  else goTo(idx + 1);
}

// ------------------------------------------------------------------ interaction
$('play').addEventListener('click', () => setPlaying(!playing));
$('prev').addEventListener('click', () => { stopPlayTimer(); goTo(idx - 1); });
$('next').addEventListener('click', () => { stopPlayTimer(); goTo(idx + 1); });
$('btn-begin').addEventListener('click', () => setPlaying(true));
$('btn-step').addEventListener('click', () => { setPlaying(false); goTo(1); });
$('p-toggle').addEventListener('click', () => {
  const p = $('panel'), open = !p.classList.contains('open');
  p.classList.toggle('open', open);
  $('p-toggle').textContent = open ? 'Less' : 'More';
  $('p-toggle').setAttribute('aria-expanded', open);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { stopPlayTimer(); goTo(idx + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { stopPlayTimer(); goTo(idx - 1); e.preventDefault(); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { setPlaying(!playing); e.preventDefault(); }
  else if (e.key === 'Home') { stopPlayTimer(); goTo(0); }
  else if (e.key === 'End') { stopPlayTimer(); goTo(SCENES.length - 1); }
  else if (e.key === 'Escape') hidePop();
});

// Free exploration: drag to pan, wheel or pinch to zoom. The next scene re-centres the camera.
let lastT = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([1e-3, 1e6])
  .on('start', () => { if (anim) { anim.stop(); anim = null; if (!arrived) arrive(); } hidePop(); })
  .on('zoom', ev => {
    const t = ev.transform, k = t.k / lastT.k;
    if (Math.abs(k - 1) > 1e-6) {
      cam.scale = Math.max(150, Math.min(260000, cam.scale * k));
    } else {
      const dx = t.x - lastT.x, dy = t.y - lastT.y;
      cam.lon -= dx / (cam.scale * Math.max(0.2, Math.cos(cam.lat * RAD))) / RAD;
      cam.lat = Math.max(-80, Math.min(80, cam.lat + dy / cam.scale / RAD));
    }
    lastT = t;
    render();
  });
svg.call(zoom).on('dblclick.zoom', null);

let rz;
addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    layout(); measureBlocked();
    if (!scene) return;
    if (anim) { anim.stop(); anim = null; }
    cam = camFor(scene); rings = JSON.parse(JSON.stringify(RS[scene.state]));
    render(); if (!arrived) arrive();
  }, 120);
});

// ------------------------------------------------------------------ start
layout();
const hm = location.hash.match(/scene=(\d+)/);
const startAt = hm ? Math.max(0, Math.min(SCENES.length - 1, +hm[1] - 1)) : 0;
if (startAt === 0) {
  scene = SCENES[0];
  cam = { lon: -42, lat: 20, scale: globeScale() * 0.6 };
  setCounter(-1);
  render();
  goTo(0, { duration: reduceMotion ? 0 : 3200, fresh: true });
} else {
  scene = SCENES[startAt];
  rings = JSON.parse(JSON.stringify(RS[scene.state]));
  layout(); cam = camFor(scene);
  goTo(startAt, { duration: 0, fresh: true });
}
})();

</script>
</body>
